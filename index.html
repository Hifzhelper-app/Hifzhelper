<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hifzhelper</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/journal-table.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/detail-pages.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div id="errorBanner"></div>
<div id="welcomeBanner"></div>

<!-- ================= LOGIN ================= -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="eyebrow">Hifzhelper</div>
    <h1>Sign in</h1>
    <label>Your ID</label>
    <input type="text" id="login_id" placeholder="e.g. K7M2QX" autocapitalize="characters">
    <label>4-digit PIN</label>
    <div class="pin-box-row">
      <input type="password" class="pin-digit" id="pin_1" inputmode="numeric" maxlength="1" pattern="[0-9]">
      <input type="password" class="pin-digit" id="pin_2" inputmode="numeric" maxlength="1" pattern="[0-9]">
      <input type="password" class="pin-digit" id="pin_3" inputmode="numeric" maxlength="1" pattern="[0-9]">
      <input type="password" class="pin-digit" id="pin_4" inputmode="numeric" maxlength="1" pattern="[0-9]">
    </div>
    <div class="form-hint">First time? Enter any 4-digit PIN — it becomes your PIN from now on.</div>
    <div style="margin-top:16px;"><button class="primary" id="loginBtn">Sign in</button></div>
    <div class="form-error" id="loginError"></div>
  </div>
</div>

<!-- ================= APP SHELL ================= -->
<div id="appShell" style="display:none;">

  <header id="authBand">
    <span class="user-name"></span>
    <button id="authBandToggle"></button>
  </header>
  <nav id="authDropdown"><div class="dropdown-inner" id="authDropdownNav"></div></nav>

  <main id="appContent">

    <!-- Home -->
    <section class="screen" id="screen-home">
      <h2>Home</h2>
      <div id="homeGrid"></div>
    </section>

    <!-- Journal (landing) -->
    <section class="screen hidden" id="screen-journal">
      <h2>Journal</h2>
      <div class="journal-wrap">
        <table class="journal-table">
          <thead>
            <tr>
              <th class="col-date">Date</th>
              <th class="col-log"><button data-nav="sabaq" id="th_sabaq"><span>Sabaq</span></button></th>
              <th class="col-log"><button data-nav="sabaqDhor" id="th_sabaqDhor"><span>Sabaq Dhor</span></button></th>
              <th class="col-log"><button data-nav="dhor" id="th_dhor"><span>Dhor</span></button></th>
              <th class="col-log">Feedback</th>
            </tr>
          </thead>
          <tbody id="journalTbody"></tbody>
        </table>
      </div>
    </section>

    <!-- Sabaq detail page -->
    <section class="screen hidden detail-page" id="screen-sabaq">
      <h2>Sabaq</h2>
      <label>Surah</label><select id="sabaq_surah"></select>
      <div class="picker-row">
        <div><label>Ayah from</label><input type="number" id="sabaq_ayah_from"></div>
        <div><label>Ayah to</label><input type="number" id="sabaq_ayah_to"></div>
      </div>
      <label>Tajweed</label>
      <div id="sabaqTajweedPicker"></div>
      <div id="sabaqCommentBlock"></div>
      <div class="form-error" id="sabaqError"></div>
      <div style="margin-top:16px;display:flex;align-items:center;">
        <span class="save-status" id="sabaqSaveStatus">saved ✓</span>
        <button class="primary" id="sabaqSaveBtn">Save entry</button>
      </div>
      <h3 style="margin-top:24px;font-size:14px;">Recent</h3>
      <div class="swipe-rail" id="sabaqRecentRail"></div>
    </section>

    <!-- Sabaq Dhor detail page -->
    <section class="screen hidden detail-page" id="screen-sabaqDhor">
      <h2>Sabaq Dhor</h2>
      <label>Zone</label><input type="text" id="sabaqDhor_zone" placeholder="e.g. Juz' 29, 30">
      <label>Mistakes</label><input type="number" id="sabaqDhor_mistakes">
      <label>Tajweed</label>
      <div id="sabaqDhorTajweedPicker"></div>
      <div id="sabaqDhorCommentBlock"></div>
      <div class="form-error" id="sabaqDhorError"></div>
      <div style="margin-top:16px;display:flex;align-items:center;">
        <span class="save-status" id="sabaqDhorSaveStatus">saved ✓</span>
        <button class="primary" id="sabaqDhorSaveBtn">Save entry</button>
      </div>
      <h3 style="margin-top:24px;font-size:14px;">Recent</h3>
      <div class="swipe-rail" id="sabaqDhorRecentRail"></div>
    </section>

    <!-- Dhor detail page -->
    <section class="screen hidden detail-page" id="screen-dhor">
      <h2>Dhor</h2>
      <label>Reference</label>
      <select id="dhor_ref">
        <option value="waterval">13-line (IndoPak)</option>
        <option value="uthmani">Uthmani</option>
      </select>
      <div class="picker-row">
        <div><label>Juz'</label><select id="dhor_juz"></select></div>
        <div><label>Starting at</label><select id="dhor_position"></select></div>
      </div>
      <label>Amount</label>
      <select id="dhor_unit">
        <option value="quarter">Quarter</option>
        <option value="half">Half juz'</option>
        <option value="full">Full juz'</option>
      </select>
      <label>Mistakes</label><input type="number" id="dhor_mistakes">
      <label>Timer</label>
      <div id="dhorTimerWrap"></div>
      <div id="dhorTimerSummary"></div>
      <label>Tajweed</label>
      <div id="dhorTajweedPicker"></div>
      <div id="dhorCommentBlock"></div>
      <div class="form-error" id="dhorError"></div>
      <div style="margin-top:16px;display:flex;align-items:center;">
        <span class="save-status" id="dhorSaveStatus">saved ✓</span>
        <button class="primary" id="dhorSaveBtn">Save entry</button>
      </div>
      <h3 style="margin-top:24px;font-size:14px;">Recent</h3>
      <div class="swipe-rail" id="dhorRecentRail"></div>
    </section>

    <!-- Admin screen -->
    <section class="screen hidden" id="screen-admin">
      <h2>Admin</h2>

      <div class="admin-register-box">
        <label>Register a new student</label>
        <div class="inline-row">
          <input type="text" id="admin_new_name" placeholder="Student's name">
          <button class="primary" id="adminRegisterBtn">Register</button>
        </div>
        <div class="form-error" id="adminRegisterError"></div>
        <div id="adminRegisterResult"></div>
      </div>

      <input type="text" id="admin_search" placeholder="Search by ID or name…">
      <div class="admin-list-wrap" id="adminUsersList"></div>
    </section>

    <!-- Placeholder for screens not yet built -->
    <section class="screen hidden" id="screen-placeholder">
      <h2 id="placeholderLabel"></h2>
      <p class="form-hint">This page isn't built yet — coming in a follow-up.</p>
    </section>

  </main>
</div>

<script src="../shared/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/home.js"></script>
<script src="js/tajweed.js"></script>
<script src="js/commentPrivacy.js"></script>
<script src="js/timer.js"></script>
<script src="js/journal.js"></script>
<script src="js/dhorPage.js"></script>
<script src="js/sabaqPage.js"></script>
<script src="js/sabaqDhorPage.js"></script>
<script src="js/adminPage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
